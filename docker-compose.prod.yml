version: '3.8'

services:
  # Django Backend (Production)
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: botsite_backend_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    networks:
      - botsite_network
    restart: unless-stopped

  # React Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend.prod
    container_name: botsite_frontend_prod
    volumes:
      - frontend_build:/app/build
    networks:
      - botsite_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: botsite_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - frontend_build:/var/www/frontend
    depends_on:
      - backend
      - frontend
    networks:
      - botsite_network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: botsite_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - botsite_network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: botsite_redis_prod
    networks:
      - botsite_network
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: botsite_celery_prod
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    networks:
      - botsite_network
    restart: unless-stopped

  # n8n Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: botsite_n8n_prod
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
    volumes:
      - n8n_data_prod:/home/node/.n8n
      - ./automation/workflows:/home/node/.n8n/workflows
    networks:
      - botsite_network
    restart: unless-stopped

networks:
  botsite_network:
    driver: bridge

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:
  frontend_build:
  n8n_data_prod:
